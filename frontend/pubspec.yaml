name: khatushyam_app
description: Khatu Shyam Baba — Hindi-first Flutter app (Android + iOS).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_riverpod: ^3.3.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_messaging: ^16.4.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  dio: ^5.11.0
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  equatable: ^2.1.0
  youtube_player_flutter: ^9.1.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/applogo.png
