name: khatushyam_app
description: Khatu Shyam Baba — Hindi-first Flutter app (Android + iOS).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_riverpod: ^3.3.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_messaging: ^16.4.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  dio: ^5.11.0
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  equatable: ^2.1.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  cached_network_image: ^3.4.1
  google_mlkit_selfie_segmentation: ^0.10.0
  image: ^4.8.0
  image_cropper: ^12.2.1
  razorpay_flutter: ^1.4.5
  alarm: ^5.1.5
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  webview_flutter_android: ^4.10.1
  webview_flutter_wkwebview: ^3.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/applogo.png
    - assets/sounds/default_alarm.m4a
